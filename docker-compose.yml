version: "3.9"

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OCR_SERVICE_URL=http://ocr_service:8001
      - GUARDRAIL_SERVICE_URL=http://guardrail_service:8002
      - ANALYSIS_SERVICE_URL=http://analysis_service:8003
      - RETRIEVAL_SERVICE_URL=http://retrieval_service:8004
      - ALTERNATIVE_SERVICE_URL=http://alternative_service:8005
      - RECIPE_SERVICE_URL=http://recipe_service:8006
      - DRIFT_SERVICE_URL=http://drift_service:8007
    depends_on:
      - ocr_service
      - guardrail_service
      - analysis_service

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
    depends_on:
      - orchestrator

  ocr_service:
    build:
      context: .
      dockerfile: services/ocr_service/Dockerfile
    ports:
      - "8001:8001"

  guardrail_service:
    build:
      context: .
      dockerfile: services/guardrail_service/Dockerfile
    ports:
      - "8002:8002"

  analysis_service:
    build:
      context: .
      dockerfile: services/analysis_service/Dockerfile
    ports:
      - "8003:8003"

  retrieval_service:
    build:
      context: .
      dockerfile: services/retrieval_service/Dockerfile
    ports:
      - "8004:8004"

  alternative_service:
    build:
      context: .
      dockerfile: services/alternative_service/Dockerfile
    ports:
      - "8005:8005"

  recipe_service:
    build:
      context: .
      dockerfile: services/recipe_service/Dockerfile
    ports:
      - "8006:8006"

  drift_service:
    build:
      context: .
      dockerfile: services/drift_service/Dockerfile
    ports:
      - "8007:8007"
